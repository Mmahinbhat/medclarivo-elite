<!DOCTYPE html>
<html lang="en">
<head>
<script>if(localStorage.getItem('mc_theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');}</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Call History — MedClarivo Elite</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="shared/auth-common.js"></script>
<script src="shared/theme-native-bg.js"></script>
<script src="shared/nav-student.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0A1424; --navy-2:#0F2038; --navy-3:#16304F;
    --teal:#0FA89A; --teal-2:#33D9C8; --teal-deep:#0A6E64;
    --gold:#B9924F; --gold-soft:rgba(185,146,79,0.14); --mist:#F5F7FA; --ink:#0B1220; --ink-soft:#56657B; --ink-faint:#8A93A3; --line:rgba(11,18,32,0.08);
  }
  [data-theme="dark"]{
    --mist:#0D1117; --ink:#F0F6FC; --ink-soft:#8B97A8; --ink-faint:#4A5568; --line:rgba(255,255,255,0.08);
  }
  [data-theme="dark"] .panel{ background:#161B22; border-color:rgba(255,255,255,0.08); }
  [data-theme="dark"] .topbar{ background:rgba(13,17,23,0.85); border-color:rgba(255,255,255,0.06); }
  *{box-sizing:border-box;}
  body{font-family:'DM Sans',sans-serif;background:var(--mist);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100dvh;}
  .font-display{font-family:'DM Serif Display',serif;}
  .font-mono{font-family:'JetBrains Mono',monospace;}
  .app-shell{display:flex;min-height:100dvh;}
  .sidebar{position:fixed;left:16px;top:16px;bottom:16px;width:260px;border-radius:24px;background:linear-gradient(174deg,var(--navy-2) 0%,var(--navy) 78%);box-shadow:0 20px 50px -20px rgba(10,20,36,0.55),0 0 0 1px rgba(255,255,255,0.04) inset;display:flex;flex-direction:column;z-index:60;overflow:hidden;}
  @media(max-width:1023px){.sidebar{transform:translateX(-130%);}.sidebar.open{transform:translateX(0);}}
  .overlay{position:fixed;inset:0;background:rgba(7,12,22,0.45);backdrop-filter:blur(2px);z-index:55;display:none;}
  .overlay.open{display:block;}
  .main-content{margin-left:292px;flex:1;min-width:0;}
  @media(max-width:1023px){.main-content{margin-left:0;}}
  .topbar{position:sticky;top:16px;z-index:50;margin:0 16px 24px 0;border-radius:20px;background:rgba(255,255,255,0.78);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid rgba(255,255,255,0.7);box-shadow:0 8px 28px -16px rgba(11,18,32,0.18);}
  .panel{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 1px 2px rgba(11,18,32,0.04),0 12px 28px -18px rgba(11,18,32,0.10);}
  .chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;font-size:11px;font-weight:700;padding:3px 10px;letter-spacing:.02em;}
  .chip-teal{background:rgba(15,168,154,0.12);color:var(--teal-deep);}
  .chip-red{background:rgba(220,38,38,0.08);color:#C0362C;}
  .chip-navy{background:rgba(11,18,32,0.06);color:var(--ink-soft);}
  .reveal{opacity:0;transform:translateY(14px);animation:reveal .6s cubic-bezier(.4,0,.2,1) forwards;}
  @keyframes reveal{to{opacity:1;transform:translateY(0);}}
  .call-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);}
  .call-row:last-child{border-bottom:none;}
  .call-icon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .call-icon.ended{background:rgba(15,168,154,0.10);color:var(--teal-deep);}
  .call-icon.missed{background:rgba(220,38,38,0.08);color:#C0362C;}
  .call-icon.rejected{background:rgba(220,38,38,0.08);color:#C0362C;}
</style>
<link rel="stylesheet" href="ios-safe-area.css">
</head>
<body>
<div class="app-shell">
  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div class="max-w-3xl mx-auto px-4">
      <div class="topbar mt-4 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <button class="lg:hidden" onclick="openSidebar()" style="background:none;border:none;cursor:pointer;">
            <i data-lucide="menu" class="w-5 h-5" style="color:var(--ink)"></i>
          </button>
          <div>
            <h1 class="font-display text-2xl">Call History</h1>
          </div>
        </div>
        <a href="my-mentor.html" style="color:var(--teal-deep);font-size:13px;font-weight:600;text-decoration:none;">
          &larr; Back to Mentor
        </a>
      </div>

      <main class="pt-4 pb-10">
        <div class="panel p-6 reveal" id="callList">
          <p class="text-ink-faint text-sm text-center py-8">Loading call history...</p>
        </div>
      </main>
    </div>
  </div>
</div>

<script>
const API_BASE = 'https://med-clarivo.onrender.com/api';
const mcToken  = localStorage.getItem('mc_token');
const mcUser   = JSON.parse(localStorage.getItem('mc_user') || '{}');
const myId     = mcUser._id || mcUser.id || '';

function openSidebar(){ document.getElementById('sidebar')?.classList.add('open'); document.getElementById('overlay')?.classList.add('open'); }
function closeSidebar(){ document.getElementById('sidebar')?.classList.remove('open'); document.getElementById('overlay')?.classList.remove('open'); }

async function loadHistory() {
  try {
    const res = await fetch(`${API_BASE}/calls/history`, {
      headers: { Authorization: `Bearer ${mcToken}` }
    });
    const data = await res.json();
    if (!data.success || !data.calls.length) {
      document.getElementById('callList').innerHTML = `
        <div class="text-center py-12">
          <i data-lucide="phone-off" class="w-8 h-8 mx-auto mb-2" style="color:var(--ink-faint)"></i>
          <p style="color:var(--ink-faint);font-size:14px;font-weight:600;">No calls yet</p>
          <p style="color:var(--ink-faint);font-size:12px;margin-top:4px;">Your call history will appear here.</p>
        </div>`;
      lucide.createIcons();
      return;
    }
    renderCalls(data.calls);
  } catch (err) {
    document.getElementById('callList').innerHTML = `<p class="text-center py-8" style="color:var(--ink-faint);font-size:14px;">Failed to load call history.</p>`;
  }
}

function renderCalls(calls) {
  const html = calls.map(c => {
    const isCaller = (c.caller?._id || c.caller) === myId;
    const other = isCaller ? c.receiver : c.caller;
    const otherName = other?.name || 'Unknown';
    const direction = isCaller ? 'Outgoing' : 'Incoming';

    let iconClass = 'ended', iconName = 'phone', chipClass = 'chip-teal', chipText = 'Completed';
    if (c.status === 'missed') {
      iconClass = 'missed'; iconName = 'phone-missed'; chipClass = 'chip-red'; chipText = 'Missed';
    } else if (c.status === 'rejected') {
      iconClass = 'rejected'; iconName = 'phone-off'; chipClass = 'chip-red'; chipText = 'Declined';
    }

    const dur = c.duration ? formatDur(c.duration) : '';
    const date = new Date(c.createdAt);
    const dateStr = date.toLocaleDateString('en-IN', { day:'numeric', month:'short' });
    const timeStr = date.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });

    return `
      <div class="call-row">
        <div class="call-icon ${iconClass}"><i data-lucide="${iconName}" class="w-5 h-5"></i></div>
        <div style="flex:1;min-width:0;">
          <p style="font-weight:600;font-size:14px;">${otherName}</p>
          <p style="font-size:12px;color:var(--ink-faint);">${direction} &middot; ${dateStr} ${timeStr}</p>
        </div>
        <div style="text-align:right;flex-shrink:0;">
          <span class="chip ${chipClass}">${chipText}</span>
          ${dur ? `<p class="font-mono" style="font-size:12px;color:var(--ink-soft);margin-top:4px;">${dur}</p>` : ''}
        </div>
      </div>`;
  }).join('');

  document.getElementById('callList').innerHTML = html;
  lucide.createIcons();
}

function formatDur(s) {
  const m = Math.floor(s / 60).toString().padStart(2, '0');
  const sec = (s % 60).toString().padStart(2, '0');
  return `${m}:${sec}`;
}

loadHistory();
lucide.createIcons();
</script>

<nav class="lg:hidden fixed bottom-0 left-0 right-0 z-40 flex items-center justify-around px-2 shadow-lg" style="background:#fff;border-top:1px solid rgba(11,18,32,0.08);height:calc(56px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);">
  <button class="flex flex-col items-center gap-1 p-2 text-ink-faint" onclick="window.location.href='dashboard.html'"><i data-lucide="layout-dashboard" class="w-5 h-5"></i><span class="text-[9px] font-semibold">Home</span></button>
  <button class="flex flex-col items-center gap-1 p-2 text-ink-faint" onclick="window.location.href='progress.html'"><i data-lucide="trending-up" class="w-5 h-5"></i><span class="text-[9px] font-semibold">Progress</span></button>
  <button class="flex flex-col items-center gap-1 p-2 text-ink-faint" onclick="window.location.href='student-messages.html'"><i data-lucide="message-circle" class="w-5 h-5"></i><span class="text-[9px] font-semibold">Messages</span></button>
  <button class="flex flex-col items-center gap-1 p-2 text-ink-faint" onclick="window.location.href='my-mentor.html'"><i data-lucide="users" class="w-5 h-5"></i><span class="text-[9px] font-semibold">Mentor</span></button>
  <button class="flex flex-col items-center gap-1 p-2 text-ink-faint" onclick="window.location.href='settings.html'"><i data-lucide="user" class="w-5 h-5"></i><span class="text-[9px] font-semibold">Profile</span></button>
</nav>
<style>@media(max-width:1023px){main,.main-content{padding-bottom:calc(72px + env(safe-area-inset-bottom)) !important;}}</style>
</body>
</html>
