<!DOCTYPE html>
<html lang="en">
<head>
<script>if(localStorage.getItem('mc_theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');}</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Voice Call — MedClarivo Elite</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="shared/auth-common.js"></script>
<script src="shared/theme-native-bg.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0A1424; --navy-2:#0F2038; --navy-3:#16304F;
    --teal:#0FA89A; --teal-2:#33D9C8; --teal-deep:#0A6E64;
    --gold:#B9924F; --gold-soft:rgba(185,146,79,0.14);
    --mist:#F5F7FA; --ink:#0B1220; --ink-soft:#56657B; --ink-faint:#8A93A3;
    --line:rgba(11,18,32,0.08);
    --red:#DC2626; --red-soft:rgba(220,38,38,0.12);
    --green:#16A34A; --green-soft:rgba(22,163,74,0.12);
  }
  [data-theme="dark"]{
    --mist:#0D1117; --ink:#F0F6FC; --ink-soft:#8B97A8; --ink-faint:#4A5568;
    --line:rgba(255,255,255,0.08);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{
    background:#0A1424;
  }
  body{
    font-family:'DM Sans', sans-serif;
    background:#0A1424;
    color:#fff;
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
  }
  .font-display{font-family:'DM Serif Display', serif;}
  .font-mono{font-family:'JetBrains Mono', monospace;}

  /* Background pulse animation */
  .bg-pulse{
    position:fixed; inset:0; z-index:0;
    background:radial-gradient(circle at 50% 40%, rgba(15,168,154,0.15) 0%, transparent 60%);
    animation:bgPulse 3s ease-in-out infinite;
  }
  @keyframes bgPulse{
    0%,100%{opacity:0.6;} 50%{opacity:1;}
  }
  .bg-pulse.ringing{ animation:bgPulse 1.2s ease-in-out infinite; }

  /* Main call container */
  .call-screen{
    position:relative; z-index:1;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    width:100%; max-width:400px;
    padding:40px 24px;
    min-height:100dvh;
  }

  /* Avatar */
  .call-avatar{
    width:120px; height:120px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'DM Serif Display', serif;
    font-size:42px; color:#fff;
    background:linear-gradient(135deg, var(--teal) 0%, var(--teal-deep) 100%);
    box-shadow:0 0 0 4px rgba(15,168,154,0.25), 0 20px 50px -15px rgba(0,0,0,0.4);
    margin-bottom:24px;
    overflow:hidden;
  }
  .call-avatar img{ width:100%; height:100%; object-fit:cover; }
  .call-avatar.ringing{
    animation:avatarRing 1.5s ease-in-out infinite;
  }
  @keyframes avatarRing{
    0%,100%{box-shadow:0 0 0 4px rgba(15,168,154,0.25), 0 20px 50px -15px rgba(0,0,0,0.4);}
    50%{box-shadow:0 0 0 18px rgba(15,168,154,0.08), 0 20px 50px -15px rgba(0,0,0,0.4);}
  }

  .call-name{
    font-family:'DM Serif Display', serif;
    font-size:28px; margin-bottom:4px;
    text-align:center;
  }
  .call-status{
    color:rgba(255,255,255,0.55);
    font-size:14px; font-weight:500;
    margin-bottom:8px;
  }
  .call-timer{
    font-family:'JetBrains Mono', monospace;
    font-size:18px; color:var(--teal-2);
    font-weight:600; letter-spacing:0.05em;
    margin-bottom:48px;
    min-height:24px;
  }

  /* Controls */
  .controls{
    display:flex; align-items:center; gap:20px;
    margin-top:auto;
    padding-bottom:calc(32px + env(safe-area-inset-bottom));
  }
  .ctrl-btn{
    width:60px; height:60px; border-radius:50%;
    border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:all .2s ease;
    position:relative;
  }
  .ctrl-btn:active{ transform:scale(0.92); }
  .ctrl-btn svg{ width:24px; height:24px; }

  .ctrl-mute{
    background:rgba(255,255,255,0.12);
    color:#fff;
  }
  .ctrl-mute.active{
    background:var(--red-soft);
    color:var(--red);
  }
  .ctrl-speaker{
    background:rgba(255,255,255,0.12);
    color:#fff;
  }
  .ctrl-speaker.active{
    background:var(--green-soft);
    color:var(--green);
  }
  .ctrl-end{
    width:68px; height:68px;
    background:var(--red);
    color:#fff;
    box-shadow:0 8px 24px -4px rgba(220,38,38,0.5);
  }
  .ctrl-end:hover{ background:#B91C1C; }

  .ctrl-accept{
    width:68px; height:68px;
    background:var(--green);
    color:#fff;
    box-shadow:0 8px 24px -4px rgba(22,163,74,0.5);
  }
  .ctrl-accept:hover{ background:#15803D; }

  .ctrl-record{
    background:rgba(255,255,255,0.12);
    color:#fff;
  }
  .ctrl-record.active{
    background:var(--red-soft);
    color:var(--red);
  }
  .ctrl-record.active::after{
    content:''; position:absolute; top:8px; right:8px;
    width:8px; height:8px; border-radius:50%;
    background:var(--red);
    animation:recBlink 1s ease-in-out infinite;
  }
  @keyframes recBlink{0%,100%{opacity:1;} 50%{opacity:0.3;}}

  /* Incoming call overlay */
  .incoming-overlay{
    position:fixed; inset:0; z-index:100;
    background:var(--navy);
    display:none; flex-direction:column;
    align-items:center; justify-content:center;
    padding:40px 24px;
  }
  .incoming-overlay.show{ display:flex; }

  /* Recording saved toast */
  .toast{
    position:fixed; bottom:100px; left:50%; transform:translateX(-50%);
    background:rgba(255,255,255,0.95); color:var(--navy);
    padding:12px 24px; border-radius:14px;
    font-size:13px; font-weight:600;
    box-shadow:0 8px 32px -8px rgba(0,0,0,0.3);
    opacity:0; transition:opacity .3s ease;
    z-index:200;
  }
  .toast.show{ opacity:1; }
</style>
<link rel="stylesheet" href="ios-safe-area.css">
</head>
<body>

<div class="bg-pulse" id="bgPulse"></div>

<!-- MAIN CALL SCREEN -->
<div class="call-screen" id="callScreen">
  <div class="call-avatar" id="callAvatar">
    <span id="callInitials"></span>
  </div>
  <div class="call-name" id="callName">Connecting...</div>
  <div class="call-status" id="callStatus">Calling</div>
  <div class="call-timer" id="callTimer"></div>

  <div class="controls" id="controls">
    <button class="ctrl-btn ctrl-mute" id="btnMute" onclick="toggleMute()" title="Mute">
      <i data-lucide="mic" class="w-6 h-6"></i>
    </button>
    <button class="ctrl-btn ctrl-record" id="btnRecord" onclick="toggleRecord()" title="Record">
      <i data-lucide="circle" class="w-6 h-6"></i>
    </button>
    <button class="ctrl-btn ctrl-end" id="btnEnd" onclick="endCall()" title="End Call">
      <i data-lucide="phone-off" class="w-6 h-6"></i>
    </button>
    <button class="ctrl-btn ctrl-speaker" id="btnSpeaker" onclick="toggleSpeaker()" title="Speaker">
      <i data-lucide="volume-2" class="w-6 h-6"></i>
    </button>
  </div>
</div>

<!-- Incoming overlay is created dynamically by showIncomingUI() only when needed -->

<div class="toast" id="toast"></div>

<!-- TEMPORARY visible debug panel -->
<div id="dbgPanel" style="position:fixed;top:0;left:0;right:0;z-index:9999;background:rgba(0,0,0,0.85);color:#0f0;font-family:monospace;font-size:10px;padding:4px 8px;max-height:35vh;overflow-y:auto;pointer-events:none;"></div>
<script>
function dbg(msg){
  var t = new Date().toLocaleTimeString();
  console.log('[DBG] '+t+' '+msg);
  var p = document.getElementById('dbgPanel');
  if(p){ p.innerHTML += t+' '+msg+'<br>'; p.scrollTop = p.scrollHeight; }
}
</script>

<audio id="remoteAudio" autoplay playsinline></audio>
<audio id="ringtone" loop preload="auto">
  <!-- We'll generate a simple tone via Web Audio if needed -->
</audio>

<script>
const API_BASE = 'https://med-clarivo.onrender.com/api';
const mcToken  = localStorage.getItem('mc_token');
const mcUser   = JSON.parse(localStorage.getItem('mc_user') || '{}');

if (!mcToken) { window.location.href = 'index.html'; }

// -- URL params --
const params      = new URLSearchParams(window.location.search);
const targetId    = params.get('userId');   // who we're calling
const targetName  = params.get('name') || 'User';
const targetAvatar= params.get('avatar') || '';
const incomingCallId = params.get('callId'); // if we got here from an incoming call
const mode        = params.get('mode');      // 'incoming' or null (outgoing)
const alreadyAccepted = params.get('accepted') === '1'; // accepted from call-listener overlay

// v4: overlay HTML is NOT in the page at all — created dynamically by showIncomingUI()
// only when callWasAccepted is false. No overlay = nothing to show = no double-accept.
dbg('PAGE LOADED — URL: ' + window.location.href);
dbg('mode=' + mode + ' alreadyAccepted=' + alreadyAccepted + ' callId=' + incomingCallId);
dbg('incomingOverlay exists in DOM? ' + !!document.getElementById('incomingOverlay'));

// -- State --
let callId        = incomingCallId || null;
let peerConnection= null;
let localStream   = null;
let remoteStream  = null;
let isMuted       = false;
let isSpeaker     = true;
let isRecording   = false;
let mediaRecorder = null;
let recordedChunks = [];
let timerInterval  = null;
let callStartTime  = null;
let ringtoneCtx    = null;
let ringtoneOsc    = null;
let iceCandidateBuffer = [];
let callWasAccepted = alreadyAccepted; // tracks if call was already accepted (prevents double-overlay)
let callEndedGracefully = false; // true when call:ended socket event arrived
let iceDisconnectTimer = null;   // fallback timer for ICE disconnect without socket event

// -- STUN/TURN (correct Metered.ca relay hostnames) --
const ICE_SERVERS = [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun.relay.metered.ca:80' },
  { urls: 'turn:global.relay.metered.ca:80', username: 'b9ace2950e1d37f0d711b482', credential: 'u0h1w1s+qf2SKC9i' },
  { urls: 'turn:global.relay.metered.ca:80?transport=tcp', username: 'b9ace2950e1d37f0d711b482', credential: 'u0h1w1s+qf2SKC9i' },
  { urls: 'turn:global.relay.metered.ca:443', username: 'b9ace2950e1d37f0d711b482', credential: 'u0h1w1s+qf2SKC9i' },
  { urls: 'turns:global.relay.metered.ca:443?transport=tcp', username: 'b9ace2950e1d37f0d711b482', credential: 'u0h1w1s+qf2SKC9i' },
];

// -- Socket --
const socketOrigin = API_BASE.replace(/\/api\/?$/, '');
const socket = io(socketOrigin, {
  auth: { token: mcToken },
  reconnection: true,
  reconnectionAttempts: 10,
  reconnectionDelay: 2000,
  timeout: 15000
});

dbg('My userId: ' + (mcUser._id || mcUser.id));
dbg('Target userId: ' + targetId);
dbg('Mode: ' + (mode || 'outgoing'));

socket.on('connect', () => {
  dbg('Socket connected: ' + socket.id);
  if (mode === 'incoming' && incomingCallId) {
    if (alreadyAccepted) {
      // Already accepted from call-listener overlay — skip the second overlay.
      // call-listener.js already emitted call:accept on its socket, but emit
      // again here in case the first one didn't reach the server in time.
      // The server should handle duplicate accepts gracefully.
      dbg('Already accepted — auto-accepting (no overlay)');
      setName(targetName, targetAvatar);
      setStatus('Connecting...');
      socket.emit('call:accept', { callId });
    } else {
      showIncomingUI();
    }
  } else if (targetId) {
    initiateCall();
  }
});

socket.on('connect_error', (err) => {
  dbg('Socket error: ' + err.message);
  setStatus('Connection failed');
});

// No more waiting for ICE gathering — we send offer/answer immediately
// and rely on trickle ICE candidates sent via socket

// -- Helper: flush buffered ICE candidates --
async function flushIceCandidates() {
  dbg('Flushing ' + iceCandidateBuffer.length + ' buffered ICE candidates');
  for (var i = 0; i < iceCandidateBuffer.length; i++) {
    try {
      await peerConnection.addIceCandidate(new RTCIceCandidate(iceCandidateBuffer[i]));
      dbg('Added buffered ICE candidate #' + (i + 1));
    } catch (e) {
      dbg('Buffered ICE err: ' + e.message);
    }
  }
  iceCandidateBuffer = [];
}

// -- Socket event handlers --
socket.on('call:ringing', ({ callId: cid }) => {
  callId = cid;
  dbg('call:ringing callId=' + cid);
  setStatus('Ringing...');
  startRingtone();
});

socket.on('call:error', ({ message }) => {
  dbg('call:error: ' + message);
  setStatus('Error: ' + message);
});

socket.on('call:accepted', async ({ callId: cid }) => {
  callId = cid;
  stopRingtone();
  setStatus('Connecting...');
  document.getElementById('bgPulse').classList.remove('ringing');
  // Only the CALLER creates the offer — receiver waits for call:offer
  if (mode !== 'incoming') {
    dbg('I am the CALLER — creating offer');
    await setupWebRTC(true);
  } else {
    dbg('I am the RECEIVER — waiting for offer');
  }
});

socket.on('call:rejected', () => {
  stopRingtone();
  setStatus('Call declined');
  setTimeout(() => goBack(), 2000);
});

socket.on('call:missed', () => {
  stopRingtone();
  setStatus('No answer');
  setTimeout(() => goBack(), 2000);
});

socket.on('call:ended', ({ duration }) => {
  dbg('call:ended received, duration=' + duration);
  callEndedGracefully = true;
  if (iceDisconnectTimer) { clearTimeout(iceDisconnectTimer); iceDisconnectTimer = null; }
  stopRingtone();
  setStatus(duration ? 'Call ended (' + formatDuration(duration) + ')' : 'Call ended');
  cleanupCall();
  setTimeout(() => goBack(), 2000);
});

// -- Vanilla ICE: Offer handler (receiver side) --
socket.on('call:offer', async ({ callId: cid, fromUserId, offer }) => {
  callId = cid;
  dbg('Got offer from ' + fromUserId);

  if (peerConnection) {
    dbg('Already have peerConnection — setting remote desc only');
    await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
    await flushIceCandidates();
    var answer2 = await peerConnection.createAnswer();
    await peerConnection.setLocalDescription(answer2);
    dbg('Sent answer (existing PC)');
    socket.emit('call:answer', { callId, targetUserId: fromUserId, answer: answer2 });
    return;
  }

  await setupWebRTC(false); // false = receiver
  await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
  await flushIceCandidates();
  var answer = await peerConnection.createAnswer();
  await peerConnection.setLocalDescription(answer);
  dbg('Sent answer');
  socket.emit('call:answer', { callId, targetUserId: fromUserId, answer: answer });
});

// -- Vanilla ICE: Answer handler (caller side) --
socket.on('call:answer', async ({ answer }) => {
  if (peerConnection) {
    dbg('Got answer — setting remote description');
    await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
    await flushIceCandidates();
    dbg('Remote description set — ICE should start checking now');
  }
});

// -- ICE candidate handler (trickle fallback + buffering) --
socket.on('call:ice-candidate', async ({ candidate }) => {
  if (!candidate) return;
  if (peerConnection && peerConnection.remoteDescription) {
    try {
      await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
      dbg('Added trickle ICE: ' + (candidate.candidate || '').substring(0, 60));
    } catch (e) {
      dbg('Trickle ICE err: ' + e.message);
    }
  } else {
    iceCandidateBuffer.push(candidate);
    dbg('Buffered ICE candidate (' + iceCandidateBuffer.length + ')');
  }
});

// Incoming call while already on this page
socket.on('call:incoming', ({ callId: cid, callerId, callerName, callerAvatar }) => {
  if (peerConnection) return; // already in a call
  if (callWasAccepted) {
    dbg('call:incoming ignored — already accepted this call');
    return; // already accepted from call-listener overlay, don't show overlay again
  }
  callId = cid;
  showIncomingUI(callerName, callerAvatar, callerId);
});

// -- Initiate outgoing call --
function initiateCall() {
  setName(targetName, targetAvatar);
  setStatus('Calling...');
  document.getElementById('bgPulse').classList.add('ringing');

  socket.emit('call:initiate', {
    receiverId: targetId,
    callerName: mcUser.name || 'User',
    callerAvatar: mcUser.avatar || '',
  });
}

// -- Incoming call UI --
let incomingCallerId = null;

function showIncomingUI(name, avatar, callerId) {
  // v4: if call was already accepted, never create overlay
  if (callWasAccepted) {
    dbg('showIncomingUI BLOCKED — call already accepted');
    return;
  }

  name = name || targetName;
  avatar = avatar || targetAvatar;
  incomingCallerId = callerId || targetId;

  // Only create the overlay DOM now — it doesn't exist in the HTML at all
  var overlay = document.getElementById('incomingOverlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'incomingOverlay';
    overlay.className = 'incoming-overlay show';
    var initContent = avatar
      ? '<img src="' + avatar + '" style="width:100%;height:100%;object-fit:cover;">'
      : getInitials(name);
    overlay.innerHTML =
      '<div class="call-avatar ringing"><span id="incomingInitials">' + initContent + '</span></div>' +
      '<div class="call-name" id="incomingName">' + (name || 'Incoming Call') + '</div>' +
      '<div class="call-status">is calling you...</div>' +
      '<div style="height:60px"></div>' +
      '<div class="controls">' +
        '<button class="ctrl-btn ctrl-end" onclick="rejectIncoming()" title="Decline">' +
          '<i data-lucide="phone-off" class="w-6 h-6"></i>' +
        '</button>' +
        '<div style="width:40px"></div>' +
        '<button class="ctrl-btn ctrl-accept" onclick="acceptIncoming()" title="Accept">' +
          '<i data-lucide="phone" class="w-6 h-6"></i>' +
        '</button>' +
      '</div>';
    document.body.appendChild(overlay);
    lucide.createIcons();
    dbg('Created incoming overlay dynamically');
  } else {
    overlay.classList.add('show');
  }

  setName(name, avatar);
  startRingtone();
}

function acceptIncoming() {
  callWasAccepted = true; // prevent call:incoming from re-showing overlay
  var ov = document.getElementById('incomingOverlay');
  if (ov) ov.parentNode.removeChild(ov); // remove entirely
  stopRingtone();
  socket.emit('call:accept', { callId });
  setStatus('Connecting...');
}

function rejectIncoming() {
  var ov = document.getElementById('incomingOverlay');
  if (ov) ov.parentNode.removeChild(ov);
  stopRingtone();
  socket.emit('call:reject', { callId });
  setTimeout(() => goBack(), 1000);
}

// -- WebRTC Setup --
async function setupWebRTC(isInitiator) {
  // Guard against being called twice
  if (window._setupInProgress) {
    dbg('setupWebRTC BLOCKED — already in progress');
    return;
  }
  if (peerConnection) {
    dbg('setupWebRTC BLOCKED — peerConnection already exists');
    return;
  }
  window._setupInProgress = true;
  iceCandidateBuffer = [];

  try {
    dbg('Requesting mic...');
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    dbg('MIC OK — tracks: ' + localStream.getAudioTracks().length);
    localStream.getAudioTracks().forEach(function(t) {
      dbg('Local track: ' + t.label + ' enabled=' + t.enabled + ' muted=' + t.muted + ' state=' + t.readyState);
    });
  } catch (err) {
    dbg('MIC DENIED: ' + err.message);
    setStatus('Microphone access denied');
    window._setupInProgress = false;
    return;
  }

  peerConnection = new RTCPeerConnection({
    iceServers: ICE_SERVERS,
    iceTransportPolicy: 'relay'  // Skip host/srflx — go straight to TURN relay
  });

  // Add local audio tracks
  localStream.getTracks().forEach(function(track) {
    peerConnection.addTrack(track, localStream);
  });

  // Handle remote stream
  peerConnection.ontrack = function(event) {
    dbg('ONTRACK — streams:' + event.streams.length);
    remoteStream = event.streams[0];

    remoteStream.getAudioTracks().forEach(function(t) {
      dbg('Remote track: enabled=' + t.enabled + ' muted=' + t.muted + ' state=' + t.readyState);
    });

    var remoteAudio = document.getElementById('remoteAudio');
    remoteAudio.srcObject = remoteStream;
    remoteAudio.volume = 1.0;

    // Force play with retry
    var playAttempt = function() {
      remoteAudio.play().then(function() {
        dbg('AUDIO PLAY OK');
      }).catch(function(e) {
        dbg('AUDIO PLAY FAIL: ' + e.message);
        setTimeout(playAttempt, 500);
      });
    };
    playAttempt();

    // Audio level monitor
    try {
      var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var analyser = audioCtx.createAnalyser();
      var source = audioCtx.createMediaStreamSource(remoteStream);
      source.connect(analyser);
      analyser.fftSize = 256;
      var dataArray = new Uint8Array(analyser.frequencyBinCount);
      var checkLevel = function() {
        if (!remoteStream) return;
        analyser.getByteFrequencyData(dataArray);
        var sum = 0;
        for (var i = 0; i < dataArray.length; i++) sum += dataArray[i];
        var avg = sum / dataArray.length;
        if (avg > 0) dbg('Audio level: ' + avg.toFixed(1));
        setTimeout(checkLevel, 3000);
      };
      setTimeout(checkLevel, 2000);
    } catch(ae) { dbg('AudioContext err: ' + ae.message); }
  };

  // ICE candidates — trickle each one to the other side immediately
  peerConnection.onicecandidate = function(event) {
    if (event.candidate) {
      var c = event.candidate;
      dbg('ICE local: ' + c.type + ' ' + c.protocol + ' ' + c.address + ':' + c.port);
      var otherId = incomingCallerId || targetId;
      socket.emit('call:ice-candidate', {
        callId: callId,
        targetUserId: otherId,
        candidate: event.candidate,
      });
    } else {
      dbg('ICE gathering done (null candidate)');
    }
  };

  peerConnection.onconnectionstatechange = function() {
    var state = peerConnection.connectionState;
    dbg('connState: ' + state);
    if (state === 'connected') {
      setStatus('In call');
      startTimer();
    } else if (state === 'disconnected' || state === 'failed') {
      if (callEndedGracefully) return; // already handled by call:ended socket event
      setStatus('Connection lost');
      // Wait 3s for the server's call:ended socket event to arrive.
      // If it does, it shows "Call ended (duration)" and navigates.
      // If not, fall back to endCall() ourselves.
      if (!iceDisconnectTimer) {
        iceDisconnectTimer = setTimeout(function() {
          if (!callEndedGracefully) {
            dbg('ICE disconnect fallback — no call:ended received');
            endCall();
          }
        }, 3000);
      }
    }
  };

  peerConnection.oniceconnectionstatechange = function() {
    var s = peerConnection.iceConnectionState;
    dbg('iceState: ' + s);
    // Only show user-friendly statuses
    if (s === 'connected' || s === 'completed') {
      setStatus('In call');
      if (!timerInterval) startTimer();
    } else if (s === 'disconnected' || s === 'failed') {
      if (!callEndedGracefully) setStatus('Connection lost');
      // Don't call endCall() here — onconnectionstatechange handles the fallback
    }
    // Don't show "checking", "new", etc. — keep "Connecting..."
  };

  peerConnection.onicegatheringstatechange = function() {
    dbg('iceGathering: ' + peerConnection.iceGatheringState);
  };

  window._setupInProgress = false;

  if (isInitiator) {
    dbg('Creating offer...');
    var offer = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offer);
    var otherId = incomingCallerId || targetId;
    dbg('Sending offer to ' + otherId);
    socket.emit('call:offer', {
      callId: callId,
      targetUserId: otherId,
      offer: offer
    });
  } else {
    dbg('Waiting for offer (receiver)...');
  }
}

// -- Controls --
function toggleMute() {
  if (!localStream) return;
  isMuted = !isMuted;
  localStream.getAudioTracks().forEach(function(t) { t.enabled = !isMuted; });

  var btn = document.getElementById('btnMute');
  btn.classList.toggle('active', isMuted);
  btn.innerHTML = isMuted
    ? '<i data-lucide="mic-off" class="w-6 h-6"></i>'
    : '<i data-lucide="mic" class="w-6 h-6"></i>';
  lucide.createIcons();
}

function toggleSpeaker() {
  isSpeaker = !isSpeaker;
  var btn = document.getElementById('btnSpeaker');
  btn.classList.toggle('active', isSpeaker);
  btn.innerHTML = isSpeaker
    ? '<i data-lucide="volume-2" class="w-6 h-6"></i>'
    : '<i data-lucide="volume-1" class="w-6 h-6"></i>';
  lucide.createIcons();
}

function toggleRecord() {
  if (!isRecording) {
    startRecording();
  } else {
    stopRecording();
  }
}

function endCall() {
  dbg('endCall() called, callId=' + callId);
  if (callId) {
    socket.emit('call:end', { callId });
  }
  if (isRecording) {
    stopRecording();
  }
  cleanupCall();
  setStatus('Call ended');
  setTimeout(function() { goBack(); }, 1500);
}

// -- Recording (client-side) --
function startRecording() {
  if (!remoteStream && !localStream) return;

  try {
    var audioCtx = new AudioContext();
    var dest = audioCtx.createMediaStreamDestination();

    if (localStream) {
      var localSrc = audioCtx.createMediaStreamSource(localStream);
      localSrc.connect(dest);
    }
    if (remoteStream) {
      var remoteSrc = audioCtx.createMediaStreamSource(remoteStream);
      remoteSrc.connect(dest);
    }

    recordedChunks = [];
    mediaRecorder = new MediaRecorder(dest.stream, {
      mimeType: MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
        ? 'audio/webm;codecs=opus' : 'audio/webm'
    });

    mediaRecorder.ondataavailable = function(e) {
      if (e.data.size > 0) recordedChunks.push(e.data);
    };

    mediaRecorder.onstop = function() {
      saveRecording();
    };

    mediaRecorder.start(1000);
    isRecording = true;

    var btn = document.getElementById('btnRecord');
    btn.classList.add('active');
    btn.innerHTML = '<i data-lucide="circle" class="w-6 h-6"></i>';
    lucide.createIcons();
    showToast('Recording started');
  } catch (err) {
    console.error('[Call] Recording error:', err);
    showToast('Could not start recording');
  }
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
  isRecording = false;

  var btn = document.getElementById('btnRecord');
  btn.classList.remove('active');
  btn.innerHTML = '<i data-lucide="circle" class="w-6 h-6"></i>';
  lucide.createIcons();
}

function saveRecording() {
  if (recordedChunks.length === 0) return;

  var blob = new Blob(recordedChunks, { type: 'audio/webm' });
  var timestamp = new Date().toISOString().replace(/[:.]/g, '-');
  var fileName  = 'call-recording-' + timestamp + '.webm';

  var url = URL.createObjectURL(blob);
  var a   = document.createElement('a');
  a.href = url;
  a.download = fileName;
  a.click();
  URL.revokeObjectURL(url);

  showToast('Recording saved');
}

// -- Timer --
function startTimer() {
  if (timerInterval) return; // prevent duplicates
  callStartTime = Date.now();
  timerInterval = setInterval(function() {
    var elapsed = Math.floor((Date.now() - callStartTime) / 1000);
    document.getElementById('callTimer').textContent = formatDuration(elapsed);
  }, 1000);
}

function formatDuration(seconds) {
  var m = Math.floor(seconds / 60).toString().padStart(2, '0');
  var s = (seconds % 60).toString().padStart(2, '0');
  return m + ':' + s;
}

// -- Ringtone (Web Audio generated) --
function startRingtone() {
  try {
    ringtoneCtx = new (window.AudioContext || window.webkitAudioContext)();
    ringtoneOsc = ringtoneCtx.createOscillator();
    var gain  = ringtoneCtx.createGain();
    ringtoneOsc.type = 'sine';
    ringtoneOsc.frequency.value = 440;
    gain.gain.value = 0.15;
    ringtoneOsc.connect(gain);
    gain.connect(ringtoneCtx.destination);

    var now = ringtoneCtx.currentTime;
    for (var i = 0; i < 30; i++) {
      gain.gain.setValueAtTime(0.15, now + i * 1.0);
      gain.gain.setValueAtTime(0, now + i * 1.0 + 0.4);
    }
    ringtoneOsc.start();
  } catch (e) { console.warn('[Call] Ringtone error:', e); }
}

function stopRingtone() {
  try {
    if (ringtoneOsc) { ringtoneOsc.stop(); ringtoneOsc = null; }
    if (ringtoneCtx) { ringtoneCtx.close(); ringtoneCtx = null; }
  } catch (e) {}
}

// -- Helpers --
function setName(name, avatar) {
  document.getElementById('callName').textContent = name;
  var initialsEl = document.getElementById('callInitials');
  if (avatar) {
    initialsEl.innerHTML = '<img src="' + avatar + '" style="width:100%;height:100%;object-fit:cover;">';
  } else {
    initialsEl.textContent = getInitials(name);
  }
}

function setStatus(text) {
  document.getElementById('callStatus').textContent = text;
}

function getInitials(name) {
  return (name || '').split(' ').map(function(w) { return w[0]; }).join('').slice(0, 2).toUpperCase();
}

function showToast(msg) {
  var toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(function() { toast.classList.remove('show'); }, 3000);
}

function cleanupCall() {
  dbg('cleanupCall()');
  stopRingtone();
  if (iceDisconnectTimer) { clearTimeout(iceDisconnectTimer); iceDisconnectTimer = null; }
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  if (localStream) { localStream.getTracks().forEach(function(t) { t.stop(); }); localStream = null; }
  if (peerConnection) { peerConnection.close(); peerConnection = null; }
  window._setupInProgress = false;
  iceCandidateBuffer = [];
  remoteStream = null;
}

function goBack() {
  if (window.history.length > 1) {
    window.history.back();
  } else {
    // Navigate based on user role
    var role = (mcUser.role || '').toLowerCase();
    window.location.href = (role === 'mentor') ? 'mentor-dashboard.html' : 'my-mentor.html';
  }
}

// Init icons
lucide.createIcons();
</script>
