<html lang="en">

<script>if(localStorage.getItem('mc_theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');}</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0A1424; --navy-2:#0F2038; --navy-3:#16304F;
    --teal:#0FA89A; --teal-2:#33D9C8; --teal-deep:#0A6E64;
    --gold:#B9924F; --gold-soft:rgba(185,146,79,0.14);
    --mist:#F5F7FA; --ink:#0B1220; --ink-soft:#56657B; --ink-faint:#8A93A3;
    --line:rgba(11,18,32,0.08);
    --red:#DC2626; --red-soft:rgba(220,38,38,0.12);
    --green:#16A34A; --green-soft:rgba(22,163,74,0.12);
  }
  [data-theme="dark"]{
    --mist:#0D1117; --ink:#F0F6FC; --ink-soft:#8B97A8; --ink-faint:#4A5568;
    --line:rgba(255,255,255,0.08);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'DM Sans', sans-serif;
    background:var(--navy);
    color:#fff;
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
  }
  .font-display{font-family:'DM Serif Display', serif;}
  .font-mono{font-family:'JetBrains Mono', monospace;}

  /* Background pulse animation */
  .bg-pulse{
    position:fixed; inset:0; z-index:0;
    background:radial-gradient(circle at 50% 40%, rgba(15,168,154,0.15) 0%, transparent 60%);
    animation:bgPulse 3s ease-in-out infinite;
  }
  @keyframes bgPulse{
    0%,100%{opacity:0.6;} 50%{opacity:1;}
  }
  .bg-pulse.ringing{ animation:bgPulse 1.2s ease-in-out infinite; }

  /* Main call container */
  .call-screen{
    position:relative; z-index:1;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    width:100%; max-width:400px;
    padding:40px 24px;
    min-height:100dvh;
  }

  /* Avatar */
  .call-avatar{
    width:120px; height:120px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'DM Serif Display', serif;
    font-size:42px; color:#fff;
    background:linear-gradient(135deg, var(--teal) 0%, var(--teal-deep) 100%);
    box-shadow:0 0 0 4px rgba(15,168,154,0.25), 0 20px 50px -15px rgba(0,0,0,0.4);
    margin-bottom:24px;
    overflow:hidden;
  }
  .call-avatar img{ width:100%; height:100%; object-fit:cover; }
  .call-avatar.ringing{
    animation:avatarRing 1.5s ease-in-out infinite;
  }
  @keyframes avatarRing{
    0%,100%{box-shadow:0 0 0 4px rgba(15,168,154,0.25), 0 20px 50px -15px rgba(0,0,0,0.4);}
    50%{box-shadow:0 0 0 18px rgba(15,168,154,0.08), 0 20px 50px -15px rgba(0,0,0,0.4);}
  }

  .call-name{
    font-family:'DM Serif Display', serif;
    font-size:28px; margin-bottom:4px;
    text-align:center;
  }
  .call-status{
    color:rgba(255,255,255,0.55);
    font-size:14px; font-weight:500;
    margin-bottom:8px;
  }
  .call-timer{
    font-family:'JetBrains Mono', monospace;
    font-size:18px; color:var(--teal-2);
    font-weight:600; letter-spacing:0.05em;
    margin-bottom:48px;
    min-height:24px;
  }

  /* Controls */
  .controls{
    display:flex; align-items:center; gap:20px;
    margin-top:auto;
    padding-bottom:calc(32px + env(safe-area-inset-bottom));
  }
  .ctrl-btn{
    width:60px; height:60px; border-radius:50%;
    border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:all .2s ease;
    position:relative;
  }
  .ctrl-btn:active{ transform:scale(0.92); }
  .ctrl-btn svg{ width:24px; height:24px; }

  .ctrl-mute{
    background:rgba(255,255,255,0.12);
    color:#fff;
  }
  .ctrl-mute.active{
    background:var(--red-soft);
    color:var(--red);
  }
  .ctrl-speaker{
    background:rgba(255,255,255,0.12);
    color:#fff;
  }
  .ctrl-speaker.active{
    background:var(--green-soft);
    color:var(--green);
  }
  .ctrl-end{
    width:68px; height:68px;
    background:var(--red);
    color:#fff;
    box-shadow:0 8px 24px -4px rgba(220,38,38,0.5);
  }
  .ctrl-end:hover{ background:#B91C1C; }

  .ctrl-accept{
    width:68px; height:68px;
    background:var(--green);
    color:#fff;
    box-shadow:0 8px 24px -4px rgba(22,163,74,0.5);
  }
  .ctrl-accept:hover{ background:#15803D; }

  .ctrl-record{
    background:rgba(255,255,255,0.12);
    color:#fff;
  }
  .ctrl-record.active{
    background:var(--red-soft);
    color:var(--red);
  }
  .ctrl-record.active::after{
    content:''; position:absolute; top:8px; right:8px;
    width:8px; height:8px; border-radius:50%;
    background:var(--red);
    animation:recBlink 1s ease-in-out infinite;
  }
  @keyframes recBlink{0%,100%{opacity:1;} 50%{opacity:0.3;}}

  /* Incoming call overlay */
  .incoming-overlay{
    position:fixed; inset:0; z-index:100;
    background:var(--navy);
    display:none; flex-direction:column;
    align-items:center; justify-content:center;
    padding:40px 24px;
  }
  .incoming-overlay.show{ display:flex; }

  /* Recording saved toast */
  .toast{
    position:fixed; bottom:100px; left:50%; transform:translateX(-50%);
    background:rgba(255,255,255,0.95); color:var(--navy);
    padding:12px 24px; border-radius:14px;
    font-size:13px; font-weight:600;
    box-shadow:0 8px 32px -8px rgba(0,0,0,0.3);
    opacity:0; transition:opacity .3s ease;
    z-index:200;
  }
  .toast.show{ opacity:1; }
</style>

<!-- DEBUG PANEL — remove once audio works -->
<div id="debugPanel" style="position:fixed;bottom:0;left:0;right:0;z-index:9999;background:rgba(0,0,0,0.85);color:#0f0;font-family:monospace;font-size:11px;padding:8px 12px;max-height:40vh;overflow-y:auto;"></div>
<script>
function dbg(msg){
  var p=document.getElementById('debugPanel');
  if(!p)return;
  var t=new Date().toLocaleTimeString();
  p.innerHTML += t+' '+msg+'<br>';
  p.scrollTop=p.scrollHeight;
  console.log('[DBG] '+msg);
}
</script>

<audio id="remoteAudio" autoplay playsinline></audio>
<audio id="ringtone" loop preload="auto">
  <!-- We'll generate a simple tone via Web Audio if needed -->
</audio>

<script>
const API_BASE = 'https://med-clarivo.onrender.com/api';
const mcToken  = localStorage.getItem('mc_token');
const mcUser   = JSON.parse(localStorage.getItem('mc_user') || '{}');

if (!mcToken) { window.location.href = 'index.html'; }

// ── URL params ────────────────────────────────────────────────
const params      = new URLSearchParams(window.location.search);
const targetId    = params.get('userId');   // who we're calling
const targetName  = params.get('name') || 'User';
const targetAvatar= params.get('avatar') || '';
const incomingCallId = params.get('callId'); // if we got here from an incoming call
const mode        = params.get('mode');      // 'incoming' or null (outgoing)

// ── State ─────────────────────────────────────────────────────
let callId        = incomingCallId || null;
let peerConnection= null;
let localStream   = null;
let remoteStream  = null;
let isMuted       = false;
let isSpeaker     = true; // default to speaker on
let isRecording   = false;
let mediaRecorder = null;
let recordedChunks = [];
let timerInterval  = null;
let callStartTime  = null;
let ringtoneCtx    = null;
let ringtoneOsc    = null;

// ── STUN/TURN ─────────────────────────────────────────────────
const ICE_SERVERS = [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
  { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' },
];

// ── Socket ────────────────────────────────────────────────────
const socketOrigin = API_BASE.replace(/\/api\/?$/, '');
const socket = io(socketOrigin, {
  auth: { token: mcToken },
  reconnection: true,
  reconnectionAttempts: 10,
  reconnectionDelay: 2000,
  timeout: 15000
});

// Debug info
console.log('[Call] My userId:', mcUser._id || mcUser.id);
console.log('[Call] Target userId:', targetId);
console.log('[Call] Mode:', mode || 'outgoing');

socket.on('connect', () => {
  console.log('[Call] Socket connected, id:', socket.id);
  if (mode === 'incoming' && incomingCallId) {
    showIncomingUI();
  } else if (targetId) {
    initiateCall();
  }
});

socket.on('connect_error', (err) => {
  console.error('[Call] Socket error:', err.message);
  setStatus('Connection failed');
});

// ── Socket event handlers ─────────────────────────────────────
socket.on('call:ringing', ({ callId: cid }) => {
  callId = cid;
  console.log('[Call] Got call:ringing, callId:', cid);
  setStatus('Ringing...');
  startRingtone();
});

socket.on('call:error', ({ message }) => {
  console.error('[Call] Server error:', message);
  setStatus('Error: ' + message);
});

socket.on('call:accepted', async ({ callId: cid }) => {
  callId = cid;
  stopRingtone();
  setStatus('Connected');
  document.getElementById('bgPulse').classList.remove('ringing');
  await setupWebRTC(true); // true = we are the caller, create offer
});

socket.on('call:rejected', () => {
  stopRingtone();
  setStatus('Call declined');
  setTimeout(() => goBack(), 2000);
});

socket.on('call:missed', () => {
  stopRingtone();
  setStatus('No answer');
  setTimeout(() => goBack(), 2000);
});

socket.on('call:ended', ({ duration }) => {
  stopRingtone();
  setStatus(duration ? `Call ended (${formatDuration(duration)})` : 'Call ended');
  cleanupCall();
  setTimeout(() => goBack(), 2000);
});

socket.on('call:offer', async ({ callId: cid, fromUserId, offer }) => {
  callId = cid;
  await setupWebRTC(false); // false = we are the receiver
  await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
  const answer = await peerConnection.createAnswer();
  await peerConnection.setLocalDescription(answer);
  socket.emit('call:answer', { callId, targetUserId: fromUserId, answer });
});

socket.on('call:answer', async ({ answer }) => {
  if (peerConnection) {
    await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
  }
});

socket.on('call:ice-candidate', async ({ candidate }) => {
  if (peerConnection && candidate) {
    try {
      await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
    } catch (e) { console.warn('[Call] ICE candidate error:', e); }
  }
});

// Incoming call while already on this page (e.g. came directly)
socket.on('call:incoming', ({ callId: cid, callerId, callerName, callerAvatar }) => {
  if (peerConnection) return; // already in a call
  callId = cid;
  showIncomingUI(callerName, callerAvatar, callerId);
});

// ── Initiate outgoing call ────────────────────────────────────
function initiateCall() {
  setName(targetName, targetAvatar);
  setStatus('Calling...');
  document.getElementById('bgPulse').classList.add('ringing');

  socket.emit('call:initiate', {
    receiverId: targetId,
    callerName: mcUser.name || 'User',
    callerAvatar: mcUser.avatar || '',
  });
}

// ── Incoming call UI ──────────────────────────────────────────
let incomingCallerId = null;

function showIncomingUI(name, avatar, callerId) {
  name = name || targetName;
  avatar = avatar || targetAvatar;
  incomingCallerId = callerId || targetId;

  const overlay = document.getElementById('incomingOverlay');
  overlay.classList.add('show');

  document.getElementById('incomingName').textContent = name;
  const initialsEl = document.getElementById('incomingInitials');
  const avatarEl   = document.getElementById('incomingAvatar');

  if (avatar) {
    initialsEl.innerHTML = `<img src="${avatar}" style="width:100%;height:100%;object-fit:cover;">`;
  } else {
    initialsEl.textContent = getInitials(name);
  }

  setName(name, avatar);
  startRingtone();
}

function acceptIncoming() {
  document.getElementById('incomingOverlay').classList.remove('show');
  stopRingtone();
  socket.emit('call:accept', { callId });
  setStatus('Connecting...');

  // The caller will send us an offer after getting 'call:accepted'
}

function rejectIncoming() {
  document.getElementById('incomingOverlay').classList.remove('show');
  stopRingtone();
  socket.emit('call:reject', { callId });
  setTimeout(() => goBack(), 1000);
}

// ── WebRTC Setup ──────────────────────────────────────────────
async function setupWebRTC(isInitiator) {
  try {
    dbg('Requesting mic...');
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    dbg('MIC OK — tracks: ' + localStream.getAudioTracks().length);
    localStream.getAudioTracks().forEach(t => {
      dbg('Local track: ' + t.label + ' enabled=' + t.enabled + ' muted=' + t.muted + ' state=' + t.readyState);
    });
  } catch (err) {
    dbg('MIC DENIED: ' + err.message);
    setStatus('Microphone access denied');
    return;
  }

  peerConnection = new RTCPeerConnection({ iceServers: ICE_SERVERS });

  // Add local audio tracks
  localStream.getTracks().forEach(track => {
    peerConnection.addTrack(track, localStream);
  });

  // Handle remote stream
  peerConnection.ontrack = (event) => {
    dbg('ONTRACK — streams:' + event.streams.length);
    remoteStream = event.streams[0];

    remoteStream.getAudioTracks().forEach(t => {
      dbg('Remote track: enabled=' + t.enabled + ' muted=' + t.muted + ' state=' + t.readyState);
    });

    const remoteAudio = document.getElementById('remoteAudio');
    remoteAudio.srcObject = remoteStream;
    remoteAudio.volume = 1.0;

    // Force play
    var playAttempt = function() {
      remoteAudio.play().then(() => {
        dbg('AUDIO PLAY OK');
      }).catch(e => {
        dbg('AUDIO PLAY FAIL: ' + e.message);
        setTimeout(playAttempt, 500);
      });
    };
    playAttempt();

    // Check audio levels every 2s
    try {
      var actx = new AudioContext();
      var src = actx.createMediaStreamSource(remoteStream);
      var analyser = actx.createAnalyser();
      analyser.fftSize = 256;
      src.connect(analyser);
      var buf = new Uint8Array(analyser.frequencyBinCount);
      setInterval(function(){
        analyser.getByteFrequencyData(buf);
        var avg = buf.reduce(function(a,b){return a+b;},0) / buf.length;
        dbg('Audio level: ' + avg.toFixed(1));
      }, 2000);
    } catch(e) { dbg('Analyser err: ' + e.message); }
  };

  // ICE candidates
  peerConnection.onicecandidate = (event) => {
    if (event.candidate) {
      const otherId = incomingCallerId || targetId;
      socket.emit('call:ice-candidate', {
        callId,
        targetUserId: otherId,
        candidate: event.candidate,
      });
    }
  };

  peerConnection.onconnectionstatechange = () => {
    const state = peerConnection.connectionState;
    dbg('connState: ' + state);
    if (state === 'connected') {
      setStatus('In call');
      startTimer();
    } else if (state === 'disconnected' || state === 'failed') {
      setStatus('Connection lost');
      endCall();
    }
  };

  peerConnection.oniceconnectionstatechange = () => {
    dbg('iceState: ' + peerConnection.iceConnectionState);
  };

  peerConnection.onicegatheringstatechange = () => {
    dbg('iceGathering: ' + peerConnection.iceGatheringState);
  };

  if (isInitiator) {
    dbg('Creating offer...');
    const offer = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offer);
    const otherId = incomingCallerId || targetId;
    dbg('Sending offer to ' + otherId);
    socket.emit('call:offer', { callId, targetUserId: otherId, offer });
  } else {
    dbg('Waiting for offer (receiver)...');
  }
}

// ── Controls ──────────────────────────────────────────────────
function toggleMute() {
  if (!localStream) return;
  isMuted = !isMuted;
  localStream.getAudioTracks().forEach(t => { t.enabled = !isMuted; });

  const btn = document.getElementById('btnMute');
  btn.classList.toggle('active', isMuted);
  btn.innerHTML = isMuted
    ? '<i data-lucide="mic-off" class="w-6 h-6"></i>'
    : '<i data-lucide="mic" class="w-6 h-6"></i>';
  lucide.createIcons();
}

function toggleSpeaker() {
  isSpeaker = !isSpeaker;
  const remoteAudio = document.getElementById('remoteAudio');
  // On mobile, toggle between earpiece and speaker
  if (remoteAudio.setSinkId) {
    // Web API — limited browser support
  }
  // Visual toggle
  const btn = document.getElementById('btnSpeaker');
  btn.classList.toggle('active', isSpeaker);
  btn.innerHTML = isSpeaker
    ? '<i data-lucide="volume-2" class="w-6 h-6"></i>'
    : '<i data-lucide="volume-1" class="w-6 h-6"></i>';
  lucide.createIcons();
}

function toggleRecord() {
  if (!isRecording) {
    startRecording();
  } else {
    stopRecording();
  }
}

function endCall() {
  if (callId) {
    socket.emit('call:end', { callId });
  }
  if (isRecording) {
    stopRecording();
  }
  cleanupCall();
  setStatus('Call ended');
  setTimeout(() => goBack(), 1500);
}

// ── Recording (client-side) ──────────────────────────────────
function startRecording() {
  if (!remoteStream && !localStream) return;

  try {
    // Mix local + remote into one stream for full recording
    const audioCtx = new AudioContext();
    const dest = audioCtx.createMediaStreamDestination();

    if (localStream) {
      const localSrc = audioCtx.createMediaStreamSource(localStream);
      localSrc.connect(dest);
    }
    if (remoteStream) {
      const remoteSrc = audioCtx.createMediaStreamSource(remoteStream);
      remoteSrc.connect(dest);
    }

    recordedChunks = [];
    mediaRecorder = new MediaRecorder(dest.stream, {
      mimeType: MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
        ? 'audio/webm;codecs=opus' : 'audio/webm'
    });

    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) recordedChunks.push(e.data);
    };

    mediaRecorder.onstop = () => {
      saveRecording();
    };

    mediaRecorder.start(1000); // collect data every second
    isRecording = true;

    const btn = document.getElementById('btnRecord');
    btn.classList.add('active');
    btn.innerHTML = '<i data-lucide="circle" class="w-6 h-6"></i>';
    lucide.createIcons();
    showToast('Recording started');
  } catch (err) {
    console.error('[Call] Recording error:', err);
    showToast('Could not start recording');
  }
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
  isRecording = false;

  const btn = document.getElementById('btnRecord');
  btn.classList.remove('active');
  btn.innerHTML = '<i data-lucide="circle" class="w-6 h-6"></i>';
  lucide.createIcons();
}

function saveRecording() {
  if (recordedChunks.length === 0) return;

  const blob = new Blob(recordedChunks, { type: 'audio/webm' });
  const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
  const fileName  = `call-recording-${timestamp}.webm`;

  // Option 1: Download locally (always works, good fallback)
  const url = URL.createObjectURL(blob);
  const a   = document.createElement('a');
  a.href = url;
  a.download = fileName;
  a.click();
  URL.revokeObjectURL(url);

  showToast('Recording saved');

  // Option 2: Upload to server (Cloudflare R2) — can be added later
  // uploadRecording(blob, fileName);
}

// ── Timer ─────────────────────────────────────────────────────
function startTimer() {
  callStartTime = Date.now();
  timerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
    document.getElementById('callTimer').textContent = formatDuration(elapsed);
  }, 1000);
}

function formatDuration(seconds) {
  const m = Math.floor(seconds / 60).toString().padStart(2, '0');
  const s = (seconds % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

// ── Ringtone (Web Audio generated) ────────────────────────────
function startRingtone() {
  try {
    ringtoneCtx = new (window.AudioContext || window.webkitAudioContext)();
    ringtoneOsc = ringtoneCtx.createOscillator();
    const gain  = ringtoneCtx.createGain();
    ringtoneOsc.type = 'sine';
    ringtoneOsc.frequency.value = 440;
    gain.gain.value = 0.15;
    ringtoneOsc.connect(gain);
    gain.connect(ringtoneCtx.destination);

    // Pulse pattern: beep 0.5s, silence 0.5s
    const now = ringtoneCtx.currentTime;
    for (let i = 0; i < 30; i++) {
      gain.gain.setValueAtTime(0.15, now + i * 1.0);
      gain.gain.setValueAtTime(0, now + i * 1.0 + 0.4);
    }
    ringtoneOsc.start();
  } catch (e) { console.warn('[Call] Ringtone error:', e); }
}

function stopRingtone() {
  try {
    if (ringtoneOsc) { ringtoneOsc.stop(); ringtoneOsc = null; }
    if (ringtoneCtx) { ringtoneCtx.close(); ringtoneCtx = null; }
  } catch (e) {}
}

// ── Helpers ───────────────────────────────────────────────────
function setName(name, avatar) {
  document.getElementById('callName').textContent = name;
  const avatarEl = document.getElementById('callAvatar');
  const initialsEl = document.getElementById('callInitials');
  if (avatar) {
    initialsEl.innerHTML = `<img src="${avatar}" style="width:100%;height:100%;object-fit:cover;">`;
  } else {
    initialsEl.textContent = getInitials(name);
  }
}

function setStatus(text) {
  document.getElementById('callStatus').textContent = text;
}

function getInitials(name) {
  return (name || '').split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

function cleanupCall() {
  stopRingtone();
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  if (peerConnection) { peerConnection.close(); peerConnection = null; }
}

function goBack() {
  if (window.history.length > 1) {
    window.history.back();
  } else {
    window.location.href = 'my-mentor.html';
  }
}

// Init icons
lucide.createIcons();
