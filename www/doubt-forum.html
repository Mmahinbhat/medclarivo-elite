<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
<script src="sessionGuard.js"></script>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>MedClarivo Elite | Doubt Forum</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="shared/auth-common.js"></script>
<script src="shared/nav-student.js"></script>
<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          navy:        "#0A1424",
          "navy-2":    "#0F2038",
          "navy-3":    "#16304F",
          teal:        "#0FA89A",
          "teal-2":    "#33D9C8",
          "teal-deep": "#0A6E64",
          gold:        "#B9924F",
          "gold-soft": "rgba(185,146,79,0.12)",
          mist:        "#F5F7FA",
          "mist-2":    "#EEF2F6",
          ink:         "#0B1220",
          "ink-soft":  "#56657B",
          "ink-faint": "#8B97A8",
          line:        "rgba(11,18,32,0.08)",
        },
        fontFamily: {
          display: ["DM Serif Display", "serif"],
          sans:    ["DM Sans", "sans-serif"],
          mono:    ["JetBrains Mono", "monospace"],
        },
      }
    }
  }
</script>
<style>
  :root{
    --navy:#0A1424; --navy-2:#0F2038; --navy-3:#16304F;
    --teal:#0FA89A; --teal-2:#33D9C8; --teal-deep:#0A6E64;
    --gold:#B9924F; --mist:#F5F7FA; --ink:#0B1220; --ink-soft:#56657B;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'DM Sans', sans-serif;
    background:var(--mist);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;
  }
  .font-display{font-family:'DM Serif Display', serif;}
  .font-mono{font-family:'JetBrains Mono', monospace;}
  ::selection{background:rgba(15,168,154,0.18);}

  /* ===== Layout shell ===== */
  .app-shell{display:flex; min-height:100dvh;}

  /* Floating sidebar */
  .sidebar{
    position:fixed; left:16px; top:16px; bottom:16px;
    width:260px; border-radius:24px;
    background:linear-gradient(174deg, var(--navy-2) 0%, var(--navy) 78%);
    box-shadow:0 20px 50px -20px rgba(10,20,36,0.55), 0 0 0 1px rgba(255,255,255,0.04) inset;
    display:flex; flex-direction:column; z-index:60;
    transition:transform .35s cubic-bezier(.4,0,.2,1), width .3s ease;
    overflow:hidden;
  }
  .sidebar.collapsed{ width:84px; }
  .sidebar.collapsed .hide-on-collapse{ display:none; }
  .sidebar.collapsed .nav-item{ justify-content:center; padding-left:0; padding-right:0; }
  .sidebar.collapsed .nav-item .nav-label{ display:none; }
  @media (max-width:1023px){
    .sidebar{ transform:translateX(-130%); }
    .sidebar.open{ transform:translateX(0); }
  }
  .main-content{ margin-left:292px; flex:1; min-width:0; transition:margin-left .3s ease; }
  .main-content.collapsed{ margin-left:116px; }
  @media (max-width:1023px){ .main-content, .main-content.collapsed{ margin-left:0; } }

  .nav-item{
    display:flex; align-items:center; gap:12px;
    padding:10px 16px; border-radius:14px;
    color:rgba(255,255,255,0.52); font-size:13.5px; font-weight:500;
    cursor:pointer; transition:all .2s ease; margin:1px 12px;
    text-decoration:none; position:relative;
  }
  .nav-item:hover{ background:rgba(255,255,255,0.06); color:#fff; transform:translateX(2px); }
  .nav-item.active{ background:rgba(15,168,154,0.16); color:#7FE9DD; }
  .nav-item.active::before{
    content:''; position:absolute; left:-12px; top:50%; transform:translateY(-50%);
    width:3px; height:18px; border-radius:3px;
    background:linear-gradient(180deg, var(--teal-2), var(--teal));
  }
  .nav-item svg{ width:18px; height:18px; flex-shrink:0; }

  /* Glass surfaces */
  .glass{
    background:rgba(255,255,255,0.7);
    backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%);
    border:1px solid rgba(255,255,255,0.6);
  }
  .glass-dark{
    background:rgba(15,32,56,0.55);
    backdrop-filter:blur(22px) saturate(160%);
    -webkit-backdrop-filter:blur(22px) saturate(160%);
    border:1px solid rgba(255,255,255,0.08);
  }

  /* Topbar */
  .topbar{
    position:sticky; top:16px; z-index:50;
    margin:0 16px 0 0; border-radius:20px;
    background:rgba(255,255,255,0.78);
    backdrop-filter:blur(18px) saturate(160%);
    -webkit-backdrop-filter:blur(18px) saturate(160%);
    border:1px solid rgba(255,255,255,0.7);
    box-shadow:0 8px 28px -16px rgba(11,18,32,0.18);
  }
  .btn-teal{background:var(--teal);color:#fff;border:none;border-radius:12px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s;display:inline-flex;align-items:center;gap:6px;}
  .btn-teal:hover{opacity:0.9;}

  /* Cards */
  .panel{
    background:#fff;
    border:1px solid var(--line);
    border-radius:22px;
    box-shadow:0 1px 2px rgba(11,18,32,0.04), 0 12px 28px -18px rgba(11,18,32,0.10);
    transition:box-shadow .25s ease, transform .25s ease;
  }
  .panel:hover{ box-shadow:0 4px 10px rgba(11,18,32,0.05), 0 22px 44px -20px rgba(11,18,32,0.16); }
  .panel-lift:hover{ transform:translateY(-3px); }

  /* Chapter modal */
  #chapterModalOverlay{
    position:fixed; inset:0; background:rgba(11,18,32,0.55);
    display:none; align-items:center; justify-content:center; z-index:80; padding:24px;
  }
  #chapterModalOverlay.open{ display:flex; }
  #chapterModal{
    background:#fff; border-radius:22px; width:100%; max-width:560px; max-height:80vh;
    display:flex; flex-direction:column; box-shadow:0 24px 64px -24px rgba(11,18,32,0.4);
  }
  .chapter-row{
    display:flex; align-items:center; justify-content:between; gap:12px;
    padding:14px 0; border-bottom:1px solid var(--line);
  }
  .chapter-row:last-child{ border-bottom:none; }
  .chapter-action-btn{
    font-size:12px; font-weight:700; padding:6px 14px; border-radius:999px;
    border:1.5px solid var(--teal); color:var(--teal-deep); background:transparent; cursor:pointer;
    transition:all .15s ease; white-space:nowrap;
  }
  .chapter-action-btn:hover{ background:rgba(15,168,154,0.08); }
  .chapter-action-btn.done{ border-color:rgba(11,18,32,0.12); color:var(--ink-soft); cursor:default; }

  /* Buttons */
  .btn-primary{
    background:linear-gradient(135deg, var(--teal) 0%, var(--teal-deep) 100%);
    color:#fff; border:none; border-radius:14px; font-weight:700;
    box-shadow:0 10px 24px -8px rgba(15,168,154,0.55);
    transition:all .2s cubic-bezier(.4,0,.2,1);
  }
  .btn-primary:hover{ transform:translateY(-2px); box-shadow:0 16px 32px -8px rgba(15,168,154,0.6); }
  .btn-primary:active{ transform:translateY(0) scale(.98); }

  .btn-outline{
    background:transparent; border:1.5px solid var(--line); color:var(--ink);
    border-radius:14px; font-weight:600; transition:all .2s ease;
  }
  .btn-outline:hover{ border-color:var(--teal); color:var(--teal-deep); background:rgba(15,168,154,0.05); }

  .btn-ghost-icon{
    width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft); transition:all .18s ease; cursor:pointer;
  }
  .btn-ghost-icon:hover{ background:rgba(11,18,32,0.05); color:var(--ink); }

  /* Badges */
  .chip{ display:inline-flex; align-items:center; gap:4px; border-radius:999px; font-size:11px; font-weight:700; padding:3px 10px; letter-spacing:.02em; }
  .chip-teal{ background:rgba(15,168,154,0.12); color:var(--teal-deep); }
  .chip-gold{ background:var(--gold-soft); color:#8A6B36; }
  .chip-red{ background:rgba(220,38,38,0.08); color:#C0362C; }
  .chip-violet{ background:rgba(124,58,237,0.08); color:#6D28D9; }
  .chip-navy{ background:rgba(11,18,32,0.06); color:var(--ink-soft); }

  /* Progress */
  .track{ background:rgba(11,18,32,0.06); border-radius:999px; overflow:hidden; }
  .fill{ background:linear-gradient(90deg, var(--teal), var(--teal-2)); border-radius:999px; transition:width 1.1s cubic-bezier(.4,0,.2,1); }

  /* Hero */
  .hero{
    position:relative; overflow:hidden; border-radius:28px;
    background:linear-gradient(135deg, var(--navy) 0%, var(--navy-3) 60%, #0A4A45 130%);
  }
  .hero-blob{ position:absolute; border-radius:50%; filter:blur(60px); opacity:.5; pointer-events:none; }
  .hero-blob.b1{ width:320px; height:320px; right:-60px; top:-100px; background:radial-gradient(circle, rgba(51,217,200,0.45), transparent 70%); animation:float1 10s ease-in-out infinite; }
  .hero-blob.b2{ width:260px; height:260px; right:160px; bottom:-120px; background:radial-gradient(circle, rgba(185,146,79,0.30), transparent 70%); animation:float2 13s ease-in-out infinite; }
  .hero-grid{
    position:absolute; inset:0; opacity:.06;
    background-image:linear-gradient(rgba(255,255,255,.6) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.6) 1px, transparent 1px);
    background-size:42px 42px;
  }
  @keyframes float1{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(-24px,18px); } }
  @keyframes float2{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(20px,-14px); } }

  /* Orbit ring (signature element) */
  .orbit-wrap{ position:relative; width:188px; height:188px; flex-shrink:0; }
  .orbit-ring-svg{ transform:rotate(-90deg); }
  .orbit-track{ stroke:rgba(255,255,255,0.12); }
  .orbit-fill{ stroke:url(#orbitGradient); stroke-linecap:round; transition:stroke-dashoffset 1.4s cubic-bezier(.4,0,.2,1); }
  .orbit-satellite{
    position:absolute; width:10px; height:10px; border-radius:50%;
    background:var(--teal-2); box-shadow:0 0 0 4px rgba(51,217,200,0.18), 0 0 16px rgba(51,217,200,0.7);
    top:50%; left:50%;
    animation:orbit 9s linear infinite;
  }
  @keyframes orbit{
    from{ transform:rotate(0deg) translateX(94px) rotate(0deg); }
    to{ transform:rotate(360deg) translateX(94px) rotate(-360deg); }
  }

  /* Countdown */
  .countdown-unit{ background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:8px 12px; text-align:center; min-width:54px; }

  /* Mentor avatar ring */
  .avatar-ring{ border:2px solid var(--teal); padding:2px; border-radius:999px; }

  /* Heatmap */
  .heat-cell{ width:13px; height:13px; border-radius:4px; background:rgba(15,168,154,0.10); }
  .heat-0{ background:rgba(11,18,32,0.05); }
  .heat-1{ background:rgba(15,168,154,0.22); }
  .heat-2{ background:rgba(15,168,154,0.42); }
  .heat-3{ background:rgba(15,168,154,0.68); }
  .heat-4{ background:linear-gradient(135deg, var(--teal), var(--teal-2)); }

  /* Task check */
  .check-btn{ width:24px; height:24px; border-radius:8px; border:1.6px solid rgba(11,18,32,0.16); flex-shrink:0; cursor:pointer; transition:all .18s ease; display:flex; align-items:center; justify-content:center; background:#fff; }
  .check-btn svg{ width:14px; height:14px; opacity:0; transform:scale(.5); transition:all .18s ease; }
  .task-row.done .check-btn{ background:var(--teal); border-color:var(--teal); }
  .task-row.done .check-btn svg{ opacity:1; transform:scale(1); stroke:#fff; }
  .task-row.done .task-label{ text-decoration:line-through; opacity:.45; }

  /* Scrollbar hide */
  .no-scrollbar::-webkit-scrollbar{ display:none; }
  .no-scrollbar{ -ms-overflow-style:none; scrollbar-width:none; }

  /* Overlay */
  .overlay{ position:fixed; inset:0; background:rgba(7,12,22,0.45); backdrop-filter:blur(2px); z-index:55; display:none; }
  .overlay.open{ display:block; }

  /* Pulse */
  @keyframes pulse-dot{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }
  .pulse-dot{ animation:pulse-dot 1.8s ease-in-out infinite; }

  /* Sparkline path animation */
  .spark-path{ stroke-dasharray:240; stroke-dashoffset:240; animation:draw 1.4s ease forwards .2s; }
  @keyframes draw{ to{ stroke-dashoffset:0; } }

  /* Reveal on load */
  .reveal{ opacity:0; transform:translateY(14px); animation:reveal .6s cubic-bezier(.4,0,.2,1) forwards; }
  @keyframes reveal{ to{ opacity:1; transform:translateY(0); } }

  /* Command palette */
  .cmdk-backdrop{ position:fixed; inset:0; background:rgba(7,12,22,0.55); backdrop-filter:blur(4px); z-index:90; display:none; align-items:flex-start; justify-content:center; padding-top:12vh; }
  .cmdk-backdrop.open{ display:flex; }
  .cmdk-box{ width:100%; max-width:560px; border-radius:18px; overflow:hidden; box-shadow:0 30px 80px -20px rgba(7,12,22,0.5); }

  /* Achievement card sheen */
  .ach-card{ position:relative; overflow:hidden; }
  .ach-card::after{
    content:''; position:absolute; inset:0; opacity:0;
    background:linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.5) 50%, transparent 70%);
    transform:translateX(-100%); transition:none;
  }
  .ach-card:hover::after{ opacity:1; animation:sheen 1s ease forwards; }
  @keyframes sheen{ to{ transform:translateX(100%); } }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  /* Focus visibility */
  a:focus-visible, button:focus-visible, input:focus-visible{
    outline:2px solid var(--teal); outline-offset:2px; border-radius:8px;
  }

  [data-tip]{ position:relative; }
  .sidebar.collapsed [data-tip]:hover::after{
    content:attr(data-tip); position:absolute; bottom:120%; left:50%; transform:translateX(-50%);
    background:var(--navy); color:#fff; font-size:11px; white-space:nowrap; padding:5px 9px;
    border-radius:8px; pointer-events:none; z-index:99; font-weight:500;
  }
</style>
<link rel="stylesheet" href="ios-safe-area.css">
</head>
<body>
<div class="app-shell">
  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<!-- ── Sidebar ── -->
  <div id="sidebar-mount"></div>

<!-- ── Main ── -->
<main class="main-content">
  <div class="max-w-5xl mx-auto px-4 md:px-6">
  <div class="topbar mt-4 h-16 flex items-center justify-between px-4 md:px-5">
    <div class="flex items-center gap-3">
      <button class="lg:hidden btn-ghost-icon" onclick="openSidebar()"><i data-lucide="menu" class="w-5 h-5"></i></button>
      <div>
        <p class="font-display text-lg text-ink leading-none">Doubt Forum</p>
      </div>
    </div>
    <button class="btn-teal" onclick="openAskModal()">
      <i data-lucide="plus" class="w-4 h-4"></i>Ask a Doubt
    </button>
  </div>

  <div class="pb-16 space-y-5" style="margin-top:24px;">

    <!-- Stats -->
    <div class="grid grid-cols-3 gap-4">
      <div class="panel p-4 text-center">
        <p class="font-display text-3xl text-teal" id="statOpen">—</p>
        <p class="text-ink-faint text-xs mt-1 font-semibold uppercase tracking-wider">Open</p>
      </div>
      <div class="panel p-4 text-center">
        <p class="font-display text-3xl text-green-600" id="statAnswered">—</p>
        <p class="text-ink-faint text-xs mt-1 font-semibold uppercase tracking-wider">Answered</p>
      </div>
      <div class="panel p-4 text-center">
        <p class="font-display text-3xl text-ink" id="statTotal">—</p>
        <p class="text-ink-faint text-xs mt-1 font-semibold uppercase tracking-wider">Total</p>
      </div>
    </div>

    <!-- Filters -->
    <div class="panel p-4 flex flex-col sm:flex-row gap-3 sm:items-center">
      <div class="flex gap-1 bg-mist p-1 rounded-xl">
        <button class="tab-btn active" id="tabAll" onclick="switchTab('all')">All</button>
        <button class="tab-btn" id="tabOpen" onclick="switchTab('open')">Open</button>
        <button class="tab-btn" id="tabAnswered" onclick="switchTab('answered')">Answered</button>
        <button class="tab-btn" id="tabClosed" onclick="switchTab('closed')">Closed</button>
      </div>
      <div class="flex gap-2 flex-wrap ml-auto">
        <div class="flex gap-1.5 flex-wrap" id="subjectFilters">
          <button class="subject-tag active" data-sub="" onclick="setSubject(this,'')">All Subjects</button>
        </div>
        <select id="priorityFilter" class="text-sm py-2 px-3 w-auto" onchange="renderDoubts()">
          <option value="">All priorities</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
      </div>
    </div>

    <!-- Search -->
    <div class="relative">
      <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-ink-faint"></i>
      <input type="text" id="searchInput" placeholder="Search doubts…" class="pl-11" oninput="renderDoubts()">
    </div>

    <!-- Skeleton -->
    <div id="doubtsSkeleton" class="space-y-3">
      <div class="h-24 skeleton rounded-xl"></div>
      <div class="h-24 skeleton rounded-xl"></div>
      <div class="h-24 skeleton rounded-xl"></div>
    </div>

    <!-- Doubts list -->
    <div id="doubtsList" class="space-y-3 hidden"></div>

  </div>
  </div>
</main>
</div>

<!-- ── Ask Doubt Modal ── -->
<div class="modal-backdrop" id="askModal">
  <div class="modal-box">
    <div class="flex items-center justify-between mb-5">
      <h3 class="font-display text-xl text-ink">Ask a Doubt</h3>
      <button onclick="closeAskModal()" class="p-1 rounded-lg hover:bg-mist"><i data-lucide="x" class="w-5 h-5 text-ink-soft"></i></button>
    </div>
    <div class="space-y-4">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-ink-soft uppercase tracking-wider mb-1.5">Subject *</label>
          <select id="askSubject">
            <option value="">Select subject</option>
            <option value="Physics">Physics</option>
            <option value="Chemistry">Chemistry</option>
            <option value="Biology">Biology</option>
            <option value="Anatomy">Anatomy</option>
            <option value="Physiology">Physiology</option>
            <option value="Biochemistry">Biochemistry</option>
            <option value="Pathology">Pathology</option>
            <option value="Pharmacology">Pharmacology</option>
            <option value="Microbiology">Microbiology</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-ink-soft uppercase tracking-wider mb-1.5">Topic</label>
          <input type="text" id="askTopic" placeholder="e.g. Krebs Cycle, Newton's Laws…">
        </div>
      </div>
      <div>
        <label class="block text-xs font-semibold text-ink-soft uppercase tracking-wider mb-1.5">Priority</label>
        <div class="flex gap-2">
          <button class="subject-tag active" data-pri="medium" onclick="setPriority(this,'medium')">Medium</button>
          <button class="subject-tag" data-pri="high" onclick="setPriority(this,'high')">🔴 High</button>
          <button class="subject-tag" data-pri="low" onclick="setPriority(this,'low')">🟢 Low</button>
        </div>
      </div>
      <div>
        <label class="block text-xs font-semibold text-ink-soft uppercase tracking-wider mb-1.5">Your Question *</label>
        <textarea id="askQuestion" rows="5" placeholder="Describe your doubt in detail. Include what you tried, what confused you, and any specific concepts…"></textarea>
        <p class="text-ink-faint text-[11px] mt-1 text-right"><span id="charCount">0</span>/3000</p>
      </div>
      <div>
        <label class="block text-xs font-semibold text-ink-soft uppercase tracking-wider mb-1.5">Tags (comma separated)</label>
        <input type="text" id="askTags" placeholder="e.g. organic-chemistry, reaction-mechanism, NEET">
      </div>
      <div class="flex gap-3 pt-1">
        <button class="btn-teal flex-1 py-3" onclick="submitDoubt()"><i data-lucide="send" class="w-4 h-4"></i>Post Doubt</button>
        <button class="btn-ghost py-3 px-6" onclick="closeAskModal()">Cancel</button>
      </div>
    </div>
  </div>
</div>

<!-- ── Doubt Detail Modal ── -->
<div class="modal-backdrop" id="detailModal">
  <div class="modal-box" style="width:700px;">
    <div class="flex items-start justify-between mb-5">
      <div class="flex-1 min-w-0 mr-4">
        <div class="flex items-center gap-2 flex-wrap mb-1" id="detailChips"></div>
        <h3 class="font-display text-xl text-ink" id="detailQuestion">—</h3>
        <p class="text-ink-faint text-xs mt-1" id="detailMeta">—</p>
      </div>
      <button onclick="closeDetailModal()" class="p-1 rounded-lg hover:bg-mist flex-shrink-0"><i data-lucide="x" class="w-5 h-5 text-ink-soft"></i></button>
    </div>

    <!-- Replies -->
    <div id="repliesContainer" class="space-y-3 mb-5 max-h-80 overflow-y-auto pr-1"></div>

    <!-- Reply box -->
    <div class="border-t border-line pt-4">
      <label class="block text-xs font-semibold text-ink-soft uppercase tracking-wider mb-2">Your Reply</label>
      <textarea id="replyInput" rows="3" placeholder="Type your reply…"></textarea>
      <div class="flex items-center justify-between mt-3">
        <button class="btn-ghost text-xs" id="closeDoubtBtn" onclick="closeDoubt()">Mark as Closed</button>
        <button class="btn-teal py-2.5 px-5" onclick="submitReply()"><i data-lucide="send" class="w-4 h-4"></i>Send Reply</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
const API = 'https://med-clarivo.onrender.com/api';
function getToken(){ return localStorage.getItem('mc_token') || localStorage.getItem('admin_token'); }
function showToast(msg){ const t=document.getElementById('toast');t.textContent=msg;t.className='toast show';setTimeout(()=>t.classList.remove('show'),3000); }
function openSidebar(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('open'); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('open'); }

let allDoubts = [];
let currentTab = 'all';
let currentSubject = '';
let currentPriority = 'medium';
let activeDoubtId = null;
let currentUser = null;

function timeAgo(d){
  const diff=(Date.now()-new Date(d))/1000;
  if(diff<60)return'just now';
  if(diff<3600)return`${Math.floor(diff/60)}m ago`;
  if(diff<86400)return`${Math.floor(diff/3600)}h ago`;
  return`${Math.floor(diff/86400)}d ago`;
}

function statusChip(s){
  const map={open:'chip-teal',answered:'chip-green',closed:'chip-grey'};
  const labels={open:'Open',answered:'Answered',closed:'Closed'};
  return`<span class="chip ${map[s]||'chip-grey'}">${labels[s]||s}</span>`;
}
function priorityChip(p){
  const map={high:'chip-red',medium:'chip-gold',low:'chip-green'};
  return`<span class="chip ${map[p]||'chip-grey'}">${p||'medium'}</span>`;
}

async function loadDoubts(){
  const token=getToken();
  if(!token){window.location.href='index.html';return;}
  try{
    const res=await fetch(`${API}/doubts`,{headers:{Authorization:`Bearer ${token}`}});
    const data=await res.json();
    if(res.ok&&data.success){
      allDoubts=data.doubts||[];
    } else {
      allDoubts=[];
    }
  } catch(e){ allDoubts=[]; }

  updateStats();
  buildSubjectFilters();
  renderDoubts();
  document.getElementById('doubtsSkeleton').classList.add('hidden');
  document.getElementById('doubtsList').classList.remove('hidden');
}

function updateStats(){
  document.getElementById('statOpen').textContent     = allDoubts.filter(d=>d.status==='open').length;
  document.getElementById('statAnswered').textContent = allDoubts.filter(d=>d.status==='answered').length;
  document.getElementById('statTotal').textContent    = allDoubts.length;
}

function buildSubjectFilters(){
  const subjects=[...new Set(allDoubts.map(d=>d.subject).filter(Boolean))];
  const container=document.getElementById('subjectFilters');
  container.innerHTML=`<button class="subject-tag active" data-sub="" onclick="setSubject(this,'')">All Subjects</button>`;
  subjects.forEach(s=>{
    const btn=document.createElement('button');
    btn.className='subject-tag';
    btn.setAttribute('data-sub',s);
    btn.textContent=s;
    btn.onclick=function(){setSubject(this,s);};
    container.appendChild(btn);
  });
}

function setSubject(btn,s){
  currentSubject=s;
  document.querySelectorAll('[data-sub]').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderDoubts();
}

function setPriority(btn,p){
  currentPriority=p;
  document.querySelectorAll('[data-pri]').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

function switchTab(tab){
  currentTab=tab;
  ['All','Open','Answered','Closed'].forEach(t=>{
    const el=document.getElementById(`tab${t}`);
    if(el) el.classList.toggle('active',t.toLowerCase()===tab);
  });
  renderDoubts();
}

function renderDoubts(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  const pri=document.getElementById('priorityFilter').value;
  let filtered=allDoubts;
  if(currentTab!=='all') filtered=filtered.filter(d=>d.status===currentTab);
  if(currentSubject) filtered=filtered.filter(d=>d.subject===currentSubject);
  if(pri) filtered=filtered.filter(d=>d.priority===pri);
  if(q) filtered=filtered.filter(d=>d.question.toLowerCase().includes(q)||d.subject.toLowerCase().includes(q)||(d.topic||'').toLowerCase().includes(q));

  const el=document.getElementById('doubtsList');
  if(filtered.length===0){
    el.innerHTML=`
      <div class="empty-state">
        <div class="w-16 h-16 rounded-2xl bg-mist flex items-center justify-center mb-4">
          <i data-lucide="help-circle" class="w-8 h-8 text-ink-faint"></i>
        </div>
        <p class="font-display text-lg text-ink">No doubts yet</p>
        <p class="text-ink-soft text-sm mt-1 max-w-xs">Post your first doubt and your mentor will answer it!</p>
        <button class="btn-teal mt-4" onclick="openAskModal()"><i data-lucide="plus" class="w-4 h-4"></i>Ask a Doubt</button>
      </div>`;
    lucide.createIcons();return;
  }

  el.innerHTML=filtered.map(d=>{
    const repliesCount=d.replies?.length||0;
    const hasAnswer=d.replies?.some(r=>r.isAnswer);
    return`
      <div class="doubt-card ${d.status}" onclick="openDetail('${d._id}')">
        <div class="flex items-start gap-3">
          <div class="w-10 h-10 rounded-xl bg-teal/10 flex items-center justify-center text-teal-deep font-bold flex-shrink-0 text-sm">${(d.student?.name||'S')[0]}</div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 flex-wrap mb-1.5">
              <span class="chip chip-blue text-[10px]">${d.subject}</span>
              ${d.topic?`<span class="text-ink-faint text-xs">· ${d.topic}</span>`:''}
              ${statusChip(d.status)}
              ${priorityChip(d.priority)}
              ${hasAnswer?'<span class="chip chip-green text-[10px]">✓ Accepted Answer</span>':''}
            </div>
            <p class="font-semibold text-ink text-sm leading-snug line-clamp-2">${d.question}</p>
            <div class="flex items-center gap-4 mt-2 text-ink-faint text-xs">
              <span><i data-lucide="message-circle" class="w-3 h-3 inline mr-1"></i>${repliesCount} ${repliesCount===1?'reply':'replies'}</span>
              <span><i data-lucide="eye" class="w-3 h-3 inline mr-1"></i>${d.views||0} views</span>
              <span>${timeAgo(d.createdAt)}</span>
              ${d.tags?.length?`<span>${d.tags.slice(0,2).map(t=>`<span class="bg-mist px-1.5 py-0.5 rounded text-[10px]">#${t}</span>`).join(' ')}</span>`:''}
            </div>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-ink-faint flex-shrink-0 mt-1"></i>
        </div>
      </div>`;
  }).join('');
  lucide.createIcons();
}

// ── Ask Modal ────────────────────────────────────────────────
function openAskModal(){
  document.getElementById('askQuestion').value='';
  document.getElementById('charCount').textContent='0';
  document.getElementById('askModal').classList.add('show');
}
function closeAskModal(){ document.getElementById('askModal').classList.remove('show'); }

document.getElementById('askQuestion').addEventListener('input',function(){
  document.getElementById('charCount').textContent=this.value.length;
});

async function submitDoubt(){
  const subject=document.getElementById('askSubject').value;
  const topic=document.getElementById('askTopic').value.trim();
  const question=document.getElementById('askQuestion').value.trim();
  const tags=document.getElementById('askTags').value.split(',').map(t=>t.trim()).filter(Boolean);
  if(!subject){showToast('Please select a subject');return;}
  if(!question||question.length<10){showToast('Please write a more detailed question');return;}
  const token=getToken();
  try{
    const res=await fetch(`${API}/doubts`,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},
      body:JSON.stringify({subject,topic,question,tags,priority:currentPriority}),
    });
    const data=await res.json();
    if(res.ok&&data.success){
      allDoubts.unshift(data.doubt);
      updateStats();
      buildSubjectFilters();
      renderDoubts();
      closeAskModal();
      showToast('✅ Doubt posted! Your mentor will answer soon.');
    } else {
      showToast('❌ '+(data.message||'Failed to post doubt'));
    }
  } catch(e){ showToast('❌ Could not reach server'); }
}

// ── Detail Modal ─────────────────────────────────────────────
async function openDetail(id){
  activeDoubtId=id;
  const token=getToken();
  try{
    const res=await fetch(`${API}/doubts/${id}`,{headers:{Authorization:`Bearer ${token}`}});
    const data=await res.json();
    if(!res.ok||!data.success){showToast('Could not load doubt');return;}
    const d=data.doubt;

    // Update local cache
    const idx=allDoubts.findIndex(x=>x._id===id);
    if(idx!==-1) allDoubts[idx]=d;

    document.getElementById('detailChips').innerHTML=
      `<span class="chip chip-blue">${d.subject}</span>${d.topic?`<span class="text-ink-faint text-sm">· ${d.topic}</span>`:''}${statusChip(d.status)}${priorityChip(d.priority)}`;
    document.getElementById('detailQuestion').textContent=d.question;
    document.getElementById('detailMeta').textContent=`Posted by ${d.student?.name||'You'} · ${timeAgo(d.createdAt)} · ${d.views||0} views`;

    // Replies
    const rc=document.getElementById('repliesContainer');
    if(!d.replies?.length){
      rc.innerHTML='<p class="text-ink-faint text-sm text-center py-6">No replies yet. Your mentor will answer soon!</p>';
    } else {
      rc.innerHTML=d.replies.map(r=>{
        const isM=['mentor','admin','super_admin'].includes(r.author?.role);
        const cls=r.isAnswer?'answer':isM?'mentor':'student';
        return`
          <div class="reply-bubble ${cls}">
            <div class="flex items-center justify-between mb-2">
              <div class="flex items-center gap-2">
                <div class="w-7 h-7 rounded-full ${isM?'bg-teal/20':'bg-mist'} flex items-center justify-center text-xs font-bold ${isM?'text-teal-deep':'text-ink-soft'}">${(r.author?.name||'?')[0]}</div>
                <span class="font-semibold text-ink text-sm">${r.author?.name||'User'}</span>
                ${isM?`<span class="chip chip-teal text-[10px]">${r.author.role}</span>`:''}
                ${r.isAnswer?'<span class="chip chip-green text-[10px]">✓ Accepted Answer</span>':''}
              </div>
              <div class="flex items-center gap-2">
                <span class="text-ink-faint text-xs">${timeAgo(r.createdAt)}</span>
                ${!r.isAnswer&&d.student?._id===currentUser?._id&&d.status!=='closed'?
                  `<button class="text-xs text-teal font-semibold hover:underline" onclick="acceptAnswer('${d._id}','${r._id}')">Accept</button>`:''}
              </div>
            </div>
            <p class="text-ink text-sm leading-relaxed whitespace-pre-line">${r.content}</p>
          </div>`;
      }).join('');
    }

    // Hide close button if already closed
    document.getElementById('closeDoubtBtn').style.display=d.status==='closed'?'none':'inline-flex';
    document.getElementById('replyInput').value='';
    document.getElementById('detailModal').classList.add('show');
    lucide.createIcons();
  } catch(e){ showToast('Could not load doubt'); }
}
function closeDetailModal(){ document.getElementById('detailModal').classList.remove('show'); activeDoubtId=null; }

async function submitReply(){
  const content=document.getElementById('replyInput').value.trim();
  if(!content){showToast('Please write a reply');return;}
  if(!activeDoubtId)return;
  const token=getToken();
  try{
    const res=await fetch(`${API}/doubts/${activeDoubtId}/reply`,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},
      body:JSON.stringify({content}),
    });
    const data=await res.json();
    if(res.ok&&data.success){
      showToast('✅ Reply posted!');
      openDetail(activeDoubtId); // reload
      updateStats();
    } else {
      showToast('❌ '+(data.message||'Failed to post reply'));
    }
  } catch(e){ showToast('❌ Could not reach server'); }
}

async function acceptAnswer(doubtId,replyId){
  const token=getToken();
  try{
    const res=await fetch(`${API}/doubts/${doubtId}/accept/${replyId}`,{
      method:'PATCH',headers:{Authorization:`Bearer ${token}`}
    });
    const data=await res.json();
    if(res.ok&&data.success){ showToast('✅ Answer accepted!'); openDetail(doubtId); }
  } catch(e){}
}

async function closeDoubt(){
  if(!activeDoubtId)return;
  if(!confirm('Mark this doubt as closed?'))return;
  const token=getToken();
  try{
    const res=await fetch(`${API}/doubts/${activeDoubtId}/close`,{
      method:'PATCH',headers:{Authorization:`Bearer ${token}`}
    });
    const data=await res.json();
    if(res.ok&&data.success){
      showToast('✅ Doubt closed');
      closeDetailModal();
      await loadDoubts();
    }
  } catch(e){}
}

// ── Load user ────────────────────────────────────────────────
async function loadUser(){
  const token=getToken();
  if(!token){window.location.href='index.html';return;}
  try{
    const res=await fetch(`${API}/auth/me`,{headers:{Authorization:`Bearer ${token}`}});
    const data=await res.json();
    if(res.ok&&data.success){
      currentUser=data.user;
      const name=data.user.name||'Student';
      document.getElementById('sidebarName').textContent=name;
      document.getElementById('avatarInitial').textContent=name[0].toUpperCase();
      document.getElementById('sidebarExamLevel').textContent=data.user.onboarding?.exam||'MedClarivo Elite';
    }
  } catch(e){}
}

window.addEventListener('load',()=>{ lucide.createIcons(); loadUser(); loadDoubts(); });
</script>
